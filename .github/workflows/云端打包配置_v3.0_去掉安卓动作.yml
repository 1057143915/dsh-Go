# 云端打包配置：把「随机壁纸补丁」编译成可以安装的 APK。
# 用法：放进 fork 仓库的 .github/workflows/，保存（推送）即自动开跑，不用点按钮。
# 补丁文件在仓库根目录，名字必须是 随机壁纸补丁_v2.0_原样显示.patch。
# 版本对齐仓库 CI 的固定值：Flutter 3.47.7、Gradle 9.3.1（仓库 wrapper）、系统 ubuntu-24.04。
# v3 改动：去掉 android-actions/setup-android@v3（它在 ubuntu-24.04 runner 上失败），
# 直接用 runner 自带的 Android SDK，并加一步「确认/补齐 SDK」。

name: 随机壁纸包

on:
  push:                 # 上传（推送）即跑：只有补丁文件或这份配置变化时才触发
    paths:
      - 随机壁纸补丁_v2.0_原样显示.patch
      - .github/workflows/*.yml
  workflow_dispatch:    # 也保留手动触发

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 确认 Android SDK（runner 自带，缺什么补什么）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --version || true
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          else
            echo "runner 上没有 sdkmanager，交给 Flutter 自行处理"
          fi

      - name: 打补丁、生成文案、检查
        run: |
          git apply 随机壁纸补丁_v2.0_原样显示.patch
          cd app
          python3 tool/l10n_merge.py
          flutter pub get
          flutter analyze
          flutter test test/wallpaper

      - name: 重录设置页截图（补丁给设置页加了 8 行）
        run: cd app && flutter test --update-goldens test/settings/wallpaper_section_test.dart

      - name: 构建调试包（调试包不打包正式版那套运行时，最快出结果）
        run: cd app && flutter build apk --debug --flavor arm64 --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: 随机壁纸-调试包
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
