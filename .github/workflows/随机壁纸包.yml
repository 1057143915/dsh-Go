# 云端打包配置 v16：模式改成底部三个标签（工作 / 伙伴 / 酒馆）+ 酒馆背景可调模糊提亮压暗
#
# 本版两件事：
# 1) 模式不再单独成页：底部一排三个标签（工作 / 伙伴 / 酒馆），每页开过一次就留着，
#    切回来还是原样；返回键在任何非「工作」标签上先回「工作」。抽屉的「模式」入口
#    改成切标签，不再压一页上去。
# 2) 酒馆每局的背景图，除了换 / 去掉，还能调模糊、提亮、压暗（跟 App 壁纸那三条滑块），
#    值存在这一局的背景里，换局各调各的。
#
# 另外 v15 的两项继续保留：release 构建（调试包 / JIT 才是全程拖动发黏的主因）、
#     原样显示的单次光栅化（换图成本减半）。

