# 云端打包配置 v12：观感跟着壁纸走（修「每换一张就回到默认模糊」）
#
# 根因：模糊/提亮/压暗只写在「当前这张壁纸」的对象里，换下一张时新对象用默认值。
# 现在观感（blur / lighten / dim）存进壁纸池设置，换图时套用同一套：
#   - 你在设置页拖的滑块会同时写进池和当前壁纸
#   - 下一张换上来沿用池里的值，不会跳回默认
# 另外 v11 的修复继续保留：原样显示不再强制归零、整图 contain 不裁切。

name: 随机壁纸包

on:
  push:
    paths:
      - .github/workflows/*.yml
  workflow_dispatch:

permissions:
  contents: read

