# 云端打包配置 v11：模糊恢复可用 + 整图不裁切 + 文字可读
#
# 修 v10 的两个错误：
#   1. v10 的「原样显示」把模糊/提亮/压暗强制归零了 —— 所以你说"模糊一点作用都没有"。
#      现在原样显示只做两件事：不盖系统自动计算的白纱、整图等比居中不裁切。
#      模糊、提亮、压暗全部恢复听你的滑块。
#   2. v10 的取景其实是裁切（cover），不是整图。改成 contain：整图缩进屏幕、居中，四周留底色。
#
# 文字看不清的解法（三档，都可以叠加）：
#   - 「模糊」往右拖：图糊了，字自然清楚，且不会像白纱那样把整张图冲掉
#   - 「压暗」（深色模式）/「提亮」（浅色模式）拖动：给图垫一层底色
#   - 文字颜色本身仍由 guardTheme 自动加深，保证对比度
# 设置页里也加了一行说明，省得不知道去哪调。

name: 随机壁纸包

on:
  push:
    paths:
      - .github/workflows/*.yml
  workflow_dispatch:

permissions:
  contents: read

