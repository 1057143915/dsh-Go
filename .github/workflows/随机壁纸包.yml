# 云端打包配置 v10：修清晰度 + 掉帧 + 秒级间隔
#
# 这一版三件事：
#   1. 【清晰】原样显示整层跳过可读性「纱」（veil）。以前模糊/提亮/压暗都调到 0，
#      渲染层仍会按对比度盖一层厚白纱，背景看起来被冲淡 —— 就是你说的"基本看不到"。
#   2. 【掉帧】三处优化：
#      - 列目录搬到后台 isolate + 30 秒缓存（切聊天不再每次数千次 stat）
#      - 原样显示的输出按屏幕像素封顶，解码也不再解到 4096 长边
#      - 换图防抖 400ms（只合并同一次切屏里的重复触发，来回切照换）
#   3. 【间隔】定时换改成秒级滑块 3 秒 ~ 10 分钟，可拖到 10 秒。
#
# 仍走官方两步：先 runtime/build-runtime.sh，再 tooling/build-apk.sh。

name: 随机壁纸包

on:
  push:
    paths:
      - .github/workflows/*.yml
  workflow_dispatch:

permissions:
  contents: read

