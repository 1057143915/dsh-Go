# 云端打包配置 v9：修三处体验问题，出带运行时的完整包
#
# 这一版改的是渲染与交互，不是配置：
#   1. 【看不清】原样显示模式下整层跳过可读性「纱」（veil）。以前即使模糊/提亮/压暗都调到 0，
#      渲染层仍按对比度往图上盖一层很重的白色 veil —— 背景基本看不见就是这个原因。
#      现在原样显示直接铺图，不模糊、不盖纱、不调色，只保留文字颜色保护（guardTheme）。
#   2. 【切回旧聊天不换】删掉 10 秒冷却。之前来回切聊天被冷却挡住，看着像"不灵敏"。
#   3. 【间隔不能手调】定时换从分钟档（5/15/30/60）改成秒级滑块：3 秒 ~ 10 分钟，
#      对数刻度，拖到 10 秒就是 10 秒。
# 另外「原样显示」默认改成开着 —— 你要的就是清晰，不该还要自己去开开关。
#
# 仍然走官方两步：先 runtime/build-runtime.sh 构建运行环境，再 tooling/build-apk.sh 打包。

name: 随机壁纸包

on:
  push:
    paths:
      - .github/workflows/*.yml
  workflow_dispatch:

permissions:
  contents: read

