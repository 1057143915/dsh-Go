jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 写入改好的源码
        run: |
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/payload.tar.gz
          tar xzf /tmp/payload.tar.gz -C .

      - name: 生成文案并下载依赖
        run: |
          cd app
          python3 tool/l10n_merge.py
          flutter pub get

      - name: 静态检查（不阻断）
        continue-on-error: true
        run: cd app && flutter analyze

      - name: 壁纸测试（不阻断）
        continue-on-error: true
        run: cd app && flutter test test/wallpaper

      - name: 缓存运行时
        uses: actions/cache@v5
        with:
          path: runtime/.cache
          key: runtime-dl-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-dl-

      - name: 第一步：构建 arm64 运行时
        run: |
          chmod +x runtime/build-runtime.sh
          runtime/build-runtime.sh arm64-v8a

      - name: 校验运行时
        run: python3 -I tooling/check_runtime_bundle.py arm64

      # tawcroot 的 libtawcroot.so 在 release 构建里必须编出来；runner 自带的
      # ANDROID_NDK_HOME 指向旧版 NDK，装上钉死版本再改指过去。
      - name: 装 NDK 28.2.13676358（tawcroot 必需）
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -f "$SDK/ndk/28.2.13676358/source.properties" && echo NDK_OK

      - name: 第二步：打 APK
        run: |
          chmod +x tooling/build-apk.sh
          tooling/build-apk.sh --release -f arm64 --build-name 1.0.15

      - name: 输出
        run: |
          APK=$(ls app/build/app/outputs/flutter-apk/*arm64*release*.apk | head -1)
          mkdir -p /tmp/out && cp "$APK" /tmp/out/DSH-Go-随机壁纸-v16.apk
          ls -lh /tmp/out/

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Go-随机壁纸-v16
          path: /tmp/out/DSH-Go-随机壁纸-v16.apk
          retention-days: 7
