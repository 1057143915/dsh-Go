# 云端打包配置：把「随机壁纸补丁」编译成可以安装的 APK。
# 用法（最省事）：把本文件放进你 fork 仓库的 .github/workflows/ 目录，保存后**自动开跑**，
# 不用去 Actions 页找按钮。补丁文件在仓库根目录，名字必须是 随机壁纸补丁_v2.0_原样显示.patch。
# 版本对齐仓库 CI 的固定值：Flutter 3.47.7、Gradle 9.3.1（仓库 wrapper）、系统 ubuntu-24.04。

name: 随机壁纸包

on:
  push:                 # 上传（推送）即跑：只有补丁文件或这份配置变化时才触发
    paths:
      - 随机壁纸补丁_v2.0_原样显示.patch
      - .github/workflows/*.yml
  workflow_dispatch:    # 也保留手动触发

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 装 Android 平台和构建工具
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 打补丁、生成文案、检查
        run: |
          git apply 随机壁纸补丁_v2.0_原样显示.patch
          cd app
          python3 tool/l10n_merge.py
          flutter pub get
          flutter analyze
          flutter test test/wallpaper

      - name: 重录设置页截图（补丁给设置页加了 8 行）
        run: cd app && flutter test --update-goldens test/settings/wallpaper_section_test.dart

      - name: 构建调试包（调试包不打包正式版那套运行时，最快出结果）
        run: cd app && flutter build apk --debug --flavor arm64 --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: 随机壁纸-调试包
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
