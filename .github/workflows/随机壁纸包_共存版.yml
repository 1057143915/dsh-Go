jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 写入改好的源码（解包覆盖，不依赖补丁）
        run: |
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/payload.tar.gz
          tar xzf /tmp/payload.tar.gz -C .
          echo "已写入的文件："
          tar tzf /tmp/payload.tar.gz

      - name: 改成共存版包名与显示名
        run: |
          GRADLE=app/android/app/build.gradle.kts
          MANIFEST=app/android/app/src/main/AndroidManifest.xml
          sed -i 's/applicationId = "io.github.ccch1mneyyy.dsh_app"/applicationId = "io.github.ccch1mneyyy.dsh_app.compat"/' "$GRADLE"
          sed -i 's/android:label="DSH Go"/android:label="DSH Go 共存"/' "$MANIFEST"
          echo "--- applicationId ---"
          grep -n 'applicationId' "$GRADLE"
          echo "--- label ---"
          grep -n 'android:label="DSH Go' "$MANIFEST"

      - name: 生成文案并下载依赖
        run: |
          cd app
          python3 tool/l10n_merge.py
          flutter pub get

      - name: 静态检查（不阻断）
        continue-on-error: true
        run: cd app && flutter analyze

      - name: 构建共存版调试包
        run: cd app && flutter build apk --debug --flavor arm64 --target-platform android-arm64

      - name: 改名便于分辨
        run: |
          mkdir -p /tmp/out
          cp app/build/app/outputs/flutter-apk/*arm64*.apk /tmp/out/DSH-Go-共存版-随机壁纸.apk
          ls -lh /tmp/out/

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Go-共存版-随机壁纸
          path: /tmp/out/DSH-Go-共存版-随机壁纸.apk
          retention-days: 7
