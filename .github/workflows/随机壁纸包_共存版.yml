# 云端打包配置 v6：共存版（换独立包名，不覆盖你现在装的 DSH Go）
#
# 与 v5.1 的区别只有两处：
#   1. 包名从 io.github.ccch1mneyyy.dsh_app 改成 io.github.ccch1mneyyy.dsh_app.compat
#      （安装时算另一个 App，可以和原版同时存在、数据互不影响）
#   2. 桌面显示名改成「DSH Go 共存」，方便一眼分清
# 其余改动（随机壁纸 + 原样显示 + 直接用原图）和 v5.1 完全一样。
#
# 注意：共存版是全新实例，第一次打开会自己下载/解压运行时（几百 MB），
# 不会读你原版 App 里的模型和配置。

name: 随机壁纸包-共存版

on:
  push:
    paths:
      - .github/workflows/*.yml
  workflow_dispatch:

permissions:
  contents: read

