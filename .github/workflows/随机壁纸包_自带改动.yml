# 云端打包配置 v5.2：不需要补丁，云端自己写入改动再构建。
#
# 为什么这么做：补丁在 fork 上 git apply 失败（版本基准不一致）。把改好的完整文件嵌进本配置
# （base64 的 tar.gz），云端解包覆盖，不依赖补丁。放进 .github/workflows/ 即自动开跑。
#
# v5.2 修复：wallpaper_import.dart 里 instantiateImageCodec 需要 Uint8List，
# 改用 File(path).readAsBytes()（v5.1 在这里编译失败：ImmutableBuffer 类型不匹配）。
#
# 载荷（9 个文件）：app.dart、wallpaper_state.dart、wallpaper_rotation.dart（新）、
# wallpaper_section.dart、custom_wallpaper.dart、wallpaper_import.dart、
# wallpaper_pool.dart（新）、wallpaper_zh.arb、wallpaper_en.arb

name: 随机壁纸包（自带改动）

on:
  push:
    paths:
      - .github/workflows/*.yml
  workflow_dispatch:

permissions:
  contents: read

