jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 写入改好的源码（解包覆盖，不依赖补丁）
        run: |
          printf '%s' "$PAYLOAD_B64" | base64 -d > /tmp/payload.tar.gz
          tar xzf /tmp/payload.tar.gz -C .
          tar tzf /tmp/payload.tar.gz

      - name: 生成文案并下载依赖
        run: |
          cd app
          python3 tool/l10n_merge.py
          flutter pub get

      - name: 静态检查（不阻断）
        continue-on-error: true
        run: cd app && flutter analyze

      - name: 壁纸测试（不阻断）
        continue-on-error: true
        run: cd app && flutter test test/wallpaper

      - name: 构建调试包
        run: cd app && flutter build apk --debug --flavor arm64 --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: 随机壁纸-调试包
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
